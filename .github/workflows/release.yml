name: release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli (for `cargo-tauri signer sign`)
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install npm deps
        run: npm ci

      - name: Tauri build (ad-hoc signed, no notarization)
        env:
          # Force ad-hoc signing identity ("-" is ad-hoc in codesign)
          CSC_IDENTITY: '-'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # macOS notarization requires a Team ID. Setting these to empty
          # strings is not enough — Tauri/codesign treat "" as "configured
          # but invalid" and try to invoke notarytool, which then fails with
          # 'Team ID must be at least 3 characters'. We need to UNSET them
          # at the shell level so they don't appear in env at all.
          # Do that by prefixing the run with `env -u` rather than via
          # GitHub's env: block above.
        run: |
          env -u APPLE_ID \
              -u APPLE_PASSWORD \
              -u APPLE_TEAM_ID \
              -u APPLE_CERTIFICATE \
              -u APPLE_CERTIFICATE_PASSWORD \
              -u APPLE_API_KEY \
              -u APPLE_API_ISSUER \
              -u APPLE_API_KEY_PATH \
              -u APPLE_SIGNING_IDENTITY \
              npm run build:clean

      - name: Package macOS .app.tar.gz (updater needs this, not the DMG)
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/macos
          # Tauri names the .app directory like "ProductName.app" (no arch
          # suffix in the directory name itself). Produce a per-arch
          # .app.tar.gz with explicit version+arch in the filename so it
          # matches the naming convention of the DMG and Windows installers
          # already produced by the build.
          # COPYFILE_DISABLE=1 + --no-mac-metadata so macOS does not embed
          # AppleDouble (._*) files — Tauri updater's GzDecoder refuses to
          # unpack those.
          # Derive version from the tag (GITHUB_REF_NAME = "v0.1.10") to
          # avoid relying on a relative path to tauri.conf.json (we are
          # `cd`'d into the bundle/macos/ directory by this point, so a
          # relative path is fragile).
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH=$(uname -m)
          for d in *.app; do
            [ -d "$d" ] || continue
            COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata \
              -czf "AdminPack.Explorer_${VERSION}_${ARCH}.app.tar.gz" "$d"
          done
          ls -la *.app.tar.gz

      - name: Upload DMG + .app.tar.gz to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            # tauri-plugin-updater on macOS expects a .app.tar.gz,
            # NOT the .dmg — must upload it too.
            src-tauri/target/release/bundle/macos/*.app.tar.gz
          # DMG creation sometimes fails on certain macOS runners, but the
          # .app.tar.gz is what the updater actually needs. Do not fail the
          # whole upload step if only the DMG is missing.
          fail_on_unmatched_files: false

      - name: Generate + sign + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate-latest-json.sh
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ./scripts/generate-latest-json.sh "${VERSION}" \
            "${{ github.repository }}" \
            "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          # Sign latest.json with the embedded private key so the installed
          # app can verify authenticity via the pubkey in tauri.conf.json.
          cargo-tauri signer sign -f latest.json
          # Replace any previous latest.json asset on this release.
          gh release upload "${TAG}" latest.json --clobber --repo "${{ github.repository }}"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli (for `cargo-tauri signer sign`)
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install npm deps
        run: npm ci

      - name: Tauri build (unsigned by default; sign via env if cert is provided)
        env:
          # Optional code signing. Leave unset for an unsigned build.
          # If signing, set TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # (see https://tauri.app/distribute/sign/windows/ — generate a .pfx once and
          #  upload it as base64 to repo secrets).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:clean

      - name: Upload Windows installers to release
        uses: softprops/action-gh-release@v2
        with:
          # Tauri 2 produces NSIS (.exe) and WiX (.msi) by default
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true

      - name: Generate + sign + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate-latest-json.sh
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ./scripts/generate-latest-json.sh "${VERSION}" \
            "${{ github.repository }}" \
            "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          cargo-tauri signer sign -f latest.json
          gh release upload "${TAG}" latest.json --clobber --repo "${{ github.repository }}"